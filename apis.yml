aid: olx
name: OLX
description: 'OLX is a global online classifieds and marketplace operator, part of OLX Group (owned by
  Prosus / Naspers), running consumer buy-and-sell marketplaces across 30+ countries under 20+ brands
  including OLX Poland (olx.pl), OLX Brazil (olx.com.br), OLX Portugal, OLX Bulgaria and OLX Romania,
  spanning general classifieds, motors/autos, and real estate. OLX Poland publishes a public Partner
  API (OAuth2) that lets integrators and sellers manage adverts, categories/attributes, and delivery
  settings programmatically. Surfaced as a portfolio company of Bessemer Venture Partners and General
  Catalyst and enriched into the API Evangelist network.'
